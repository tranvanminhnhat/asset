spring:
  datasource:
    url: jdbc:h2:mem:asset_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  task:
    scheduling:
      enabled: false

logging:
  level:
    root: INFO
    com.vn.asset: DEBUG
    org.hibernate.SQL: DEBUG

