spring:
  application:
    name: asset

  # Database Configuration
  # Using MySQL (same as production)
  # For local MySQL: update username, password, and url as needed
  datasource:
    url: jdbc:mysql://viaduct.proxy.rlwy.net:36228/asset_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:MQTRfyRKCFZdhGrMpAbKXJNebafyHFLw}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update  # Update schema without dropping tables (safe for MySQL)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Task Scheduling Configuration
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: asset-scheduler-

  # Email Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: tranvanminhnhat99@gmail.com  # Change to your Gmail
    password: 'xsxw nqab vesg hzfp'       # Change to your App Password
    protocol: smtp
    default-encoding: UTF-8
    properties:
